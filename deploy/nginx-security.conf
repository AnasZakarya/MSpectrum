# MSpectrum - Nginx security hardening snippet
# ---------------------------------------------------------------------------
# Include inside the server{} block that serves MSpectrum, e.g.:
#     server {
#         listen 443 ssl http2;
#         server_name mspectrum.example.org;
#         root /var/www/mspectrum;      # folder containing index.html
#         include /etc/nginx/snippets/mspectrum-security.conf;
#         ...
#     }
#
# MSpectrum is a fully static, client-side app. No PHI is transmitted to the
# server, so the server never stores patient data. Its job is only to serve
# the files over HTTPS with safe headers.

# --- TLS is assumed to be configured on the server{} (listen 443 ssl). ---
# Force HTTPS: redirect the plain-HTTP vhost to https (put in the :80 server).
#   return 301 https://$host$request_uri;

# --- Security headers (add_header ... always, so they apply to errors too) ---
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://docs.opencv.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com https://docs.opencv.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# --- Do not log query strings / referrers with potential identifiers ---
# The app puts no PHI in URLs, but keep access logs minimal on a clinical host.
# access_log off;   # uncomment to disable access logs entirely

# --- Long-cache static, content-pinned assets ---
location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

# --- Never serve the git metadata or backups if the folder is a checkout ---
location ~ /\.(git|gitignore|github) { deny all; }
location ~* /(backup|_old_backups|scratch)/ { deny all; }
