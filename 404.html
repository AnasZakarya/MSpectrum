}

.brand-name{font-family:Georgia,serif;font-weight:700;font-size:22px;color:var(--accent-ink)}

.brand-sub{font-size:11.5px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card-404{max-width:520px;width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:40px 32px;text-align:center;box-shadow:0 4px 20px rgba(30,74,110,0.08)}
.big-404{font-family:Georgia,serif;font-size:88px;font-weight:600;color:var(--accent-ink);line-height:1;margin:0 0 8px;letter-spacing:-2px}
.title{font-family:Georgia,serif;font-size:22px;color:var(--ink);font-weight:500;margin:8px 0 4px}
.subtitle{color:var(--ink-soft);font-size:14px;margin:8px 0 24px;line-height:1.6}
.links{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:0 auto}
.link-primary,.link-secondary{padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.link-primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.link-primary:hover{background:var(--accent-ink);transform:translateY(-1px)}
.link-secondary{background:transparent;color:var(--accent);border:1px solid var(--rule-strong)}
.link-secondary:hover{border-color:var(--accent);background:var(--accent-soft)}
footer{padding:14px 20px;text-align:center;color:var(--ink-faint);font-size:12px;border-top:1px solid var(--rule)}
footer a{color:var(--ink-soft);text-decoration:none;margin:0 6px}
footer a:hover{color:var(--accent)}
.dot{color:var(--rule-strong)}
@media (max-width:520px){
  .big-404{font-size:64px}
  .title{font-size:18px}
  .card-404{padding:28px 20px}

@media (prefers-reduced-motion: reduce){
